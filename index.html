<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KeeSnap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>KeeSnap</title>
</head>
<body>
<header><h1>🔐 <span data-i18n="appName">KeeSnap</span></h1><button id="lockBtn" class="ghost hidden" data-i18n="lock">Lock</button></header>

<section id="setup" class="screen hidden">
  <h2 data-i18n="setupTitle"></h2>
  <p class="hint" data-i18n-html="setupHint"></p>
  <input id="pw1" type="password" data-i18n-ph="pw1" autocomplete="new-password">
  <input id="pw2" type="password" data-i18n-ph="pw2" autocomplete="new-password">
  <button id="setupBtn" data-i18n="setupBtn"></button>
  <p id="setupMsg" class="err"></p>
</section>

<section id="unlock" class="screen hidden">
  <h2 data-i18n="unlockTitle"></h2>
  <input id="pw" type="password" data-i18n-ph="pw" autocomplete="current-password">
  <button id="unlockBtn" data-i18n="unlockBtn"></button>
  <p id="unlockMsg" class="err"></p>
</section>

<section id="main" class="screen hidden">
  <input id="search" type="search" data-i18n-ph="search">
  <div id="chips"></div>
  <ul id="list"></ul>
  <p id="empty" class="hint hidden" data-i18n="empty"></p>
  <details class="tools">
    <summary data-i18n="tools"></summary>
    <button id="exportBtn" class="ghost" data-i18n="exportBtn"></button>
    <label class="ghost filebtn"><span data-i18n="importBtn"></span><input id="importFile" type="file" accept=".json,application/json" hidden></label>
    <label class="row"><span data-i18n="langLabel"></span> <select id="langSel"><option value="en">English</option><option value="zh">中文</option></select></label>
    <p id="storageInfo" class="hint"></p>
    <p id="appVersion" class="hint" data-i18n="appVersion"></p>
  </details>
  <div class="fabGroup">
    <label class="fab"><span data-i18n="fab"></span><input id="photo" type="file" accept="image/*" capture="environment" hidden></label>
    <button id="albumBtn" class="fabSecondary" type="button" data-i18n="album"></button>
    <input id="albumFiles" type="file" accept="image/*" multiple hidden>
  </div>
</section>

<section id="crop" class="screen hidden">
  <h2 id="cropTitle" data-i18n="cropTitle"></h2>
  <p id="cropProgress" class="hint hidden"></p>
  <p class="hint" data-i18n="cropInstructions"></p>
  <canvas id="cropCanvas" aria-labelledby="cropTitle"></canvas>
  <div class="row"><button id="useCropBtn" data-i18n="useCrop"></button><button id="skipCropBtn" class="ghost" data-i18n="skipCrop"></button><button id="skipImageCropBtn" class="ghost" data-i18n="skipImage"></button></div>
</section>

<section id="review" class="screen hidden">
  <img id="reviewImg" alt="">
  <p id="reviewProgress" class="hint hidden"></p>
  <p id="ocrStatus" class="hint"></p>
  <button id="showRemovedLinesBtn" type="button" class="ghost hidden" aria-expanded="false"></button>
  <pre id="removedLines" class="hint hidden"></pre>
  <label><span data-i18n="ocrMode"></span><select id="ocrMode">
    <option value="auto" data-i18n="ocrModeAuto"></option>
    <option value="code" data-i18n="ocrModeCode"></option>
    <option value="eng" data-i18n="ocrModeEnglish"></option>
    <option value="chi_sim" data-i18n="ocrModeChinese"></option>
    <option value="eng+chi_sim" data-i18n="ocrModeBoth"></option>
  </select></label>
  <button id="rerunOcrBtn" type="button" class="ghost" data-i18n="rerunOcr"></button>
  <button id="cropAgainBtn" type="button" class="ghost" data-i18n="cropAgain"></button>
  <label><span data-i18n="title"></span><input id="title"></label>
  <label><span data-i18n="category"></span><select id="category"></select></label>
  <label><span data-i18n="ocrText"></span><textarea id="ocrText" rows="8"></textarea></label>
  <p class="hint" data-i18n="imagesSaved"></p>
  <div class="row"><button id="saveBtn" disabled data-i18n="save"></button><button id="skipImageReviewBtn" class="ghost" data-i18n="skipImage"></button><button id="cancelBtn" class="ghost" data-i18n="cancel"></button></div>
</section>

<section id="detail" class="screen hidden">
  <h2 id="dTitle"></h2>
  <p id="dMeta" class="hint"></p>
  <pre id="dText"></pre>
  <div class="row"><button id="copyBtn" data-i18n="copy"></button><button id="backBtn" class="ghost" data-i18n="back"></button><button id="delBtn" class="danger" data-i18n="del"></button></div>
  <p id="dOriginalLabel" class="hint" data-i18n="originalImage"></p>
  <img id="dImg" alt="">
  <p id="dCropLabel" class="hint" data-i18n="croppedImage"></p>
  <img id="dCropImg" alt="">
</section>

<dialog id="deleteDialog">
  <p id="deletePrompt"></p>
  <input id="deletePhrase" type="text" autocomplete="off" class="hidden">
  <div class="row">
    <button id="deleteCancel" class="ghost" type="button"></button>
    <button id="deleteAdvance" class="danger" type="button"></button>
    <button id="deleteConfirm" class="danger hidden" type="button" disabled></button>
  </div>
</dialog>

<div id="updateBar" class="hidden"><span data-i18n="updateReady"></span> <button id="updateBtn" data-i18n="updateBtn"></button></div>

<script src="vendor/tesseract/tesseract.min.js"></script>
<script src="vendor/ppocr/ort.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
